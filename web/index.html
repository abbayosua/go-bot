<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Go-Bot</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <span class="dot"></span>
        <strong>Go-Bot</strong>
        <button id="new-bot" class="icon" title="New bot">+</button>
      </header>
      <label class="field">
        <span>Approvals</span>
        <select id="approval">
          <option value="ask">Ask</option>
          <option value="auto">Auto</option>
          <option value="never">Never ask</option>
        </select>
      </label>
      <label class="field">
        <span>Space</span>
        <select id="space"></select>
      </label>
      <div class="row">
        <button id="new-space" class="ghost">New space</button>
        <button id="delete-space" class="ghost">Delete</button>
      </div>
      <div class="row">
        <button id="new-group" class="ghost">New group</button>
      </div>
      <nav id="bots" class="roster"></nav>
    </aside>
    <div id="resize" title="Drag to resize"></div>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="bot-name">No bot yet</h1>
          <p id="bot-meta" class="muted"></p>
        </div>
        <div class="actions">
          <button id="search-toggle" class="ghost">Search</button>
          <button id="audit-toggle" class="ghost">Audit</button>
          <button id="admin-toggle" class="ghost">Admin</button>
          <button id="plugins-toggle" class="ghost">Plugins</button>
          <button id="board-toggle" class="ghost">Board</button>
          <button id="backup-toggle" class="ghost">Backup</button>
          <button id="routines-toggle" class="ghost">Routines</button>
          <button id="memory-toggle" class="ghost">Memory</button>
          <button id="scratchpad-toggle" class="ghost">Notes</button>
          <button id="skills-toggle" class="ghost">Skills</button>
          <button id="rules-toggle" class="ghost">Rules</button>
          <button id="settings-toggle" class="ghost">Bot settings</button>
        </div>
      </header>

      <section id="audit" class="panel hidden">
        <ul id="audit-list" class="list"></ul>
        <div class="row"><a id="audit-csv" href="/api/audit?format=csv&limit=1000">Export CSV</a></div>
      </section>

      <section id="backup" class="panel hidden">
        <div class="row">
          <a href="/api/backup">Download backup</a>
          <span id="backup-status" class="meta"></span>
        </div>
        <form id="backup-form" class="stack">
          <input type="file" name="file" accept="application/json" />
          <div class="row"><button type="submit">Restore backup</button></div>
        </form>
      </section>

      <section id="board" class="panel hidden">
        <div id="board-cols" class="board"></div>
        <form id="board-form" class="stack">
          <input name="title" placeholder="New card…" autocomplete="off" />
          <div class="row"><button type="submit">Add</button></div>
        </form>
      </section>

      <section id="plugins" class="panel hidden">
        <form id="plugin-form" class="stack">
          <input name="path" placeholder="Folder under plugins/, e.g. upper" autocomplete="off" />
          <div class="row">
            <button type="submit">Install</button>
            <span id="plugin-error" class="error"></span>
          </div>
        </form>
        <ul id="plugin-list" class="list"></ul>
      </section>

      <section id="admin" class="panel hidden">
        <div class="stack">
          <label class="field"><span data-i18n="admin.language">Language</span>
            <select id="lang"><option value="en">English</option><option value="id">Indonesia</option></select>
          </label>
          <h2 data-i18n="admin.title">Admin</h2>
          <ul id="admin-list" class="list"></ul>
        </div>
      </section>

      <section id="search" class="panel hidden">
        <form id="search-form" class="stack">
          <input name="q" placeholder="Search every bot's messages…" autocomplete="off" />
          <div class="row">
            <button type="submit">Search</button>
            <span id="search-error" class="error"></span>
          </div>
        </form>
        <ul id="search-list" class="list"></ul>
      </section>

      <section id="routines" class="panel hidden">
        <form id="routine-form" class="stack">
          <input name="name" placeholder="Name" autocomplete="off" />
          <textarea name="prompt" placeholder="What should it do each run?" rows="2"></textarea>
          <input name="cron" placeholder="Cron, e.g. 0 8 * * 1-5" value="0 8 * * 1-5" autocomplete="off" />
          <div class="row">
            <button type="submit">Add routine</button>
            <span id="routine-error" class="error"></span>
          </div>
        </form>
        <ul id="routine-list" class="list"></ul>
      </section>

      <section id="memory" class="panel hidden">
        <ul id="memory-list" class="list"></ul>
      </section>

      <section id="scratchpad" class="panel hidden">
        <form id="scratchpad-form" class="stack">
          <input name="text" placeholder="Jot a working note…" autocomplete="off" />
          <div class="row">
            <button type="submit">Add note</button>
            <button type="button" id="scratchpad-clear" class="ghost">Clear all</button>
            <span id="scratchpad-error" class="error"></span>
          </div>
        </form>
        <ul id="scratchpad-list" class="list"></ul>
      </section>

      <section id="skills" class="panel hidden">
        <form id="skill-form" class="stack">
          <input name="name" placeholder="Skill name, e.g. code-review" autocomplete="off" />
          <input name="description" placeholder="One-line description" autocomplete="off" />
          <textarea name="body" placeholder="The playbook the bot should follow" rows="3"></textarea>
          <div class="row">
            <button type="submit">Add skill</button>
            <span id="skill-error" class="error"></span>
          </div>
        </form>
        <ul id="skill-list" class="list"></ul>
      </section>

      <section id="rules" class="panel hidden">
        <form id="rule-form" class="stack">
          <select name="kind">
            <option value="allow">Always allow</option>
            <option value="deny">Never allow</option>
          </select>
          <input name="tool" placeholder="Tool, e.g. shell (blank matches every tool)" autocomplete="off" />
          <input name="args" placeholder='Arguments JSON, e.g. {"command":"ls"} (blank matches all)' autocomplete="off" />
          <label class="row"><input type="checkbox" name="shared" checked /> Applies to every bot</label>
          <div class="row">
            <button type="submit">Add rule</button>
            <span id="rule-error" class="error"></span>
          </div>
        </form>
        <ul id="rule-list" class="list"></ul>
      </section>

      <section id="settings" class="panel hidden">
        <div class="stack">
          <h2>Instruction history</h2>
          <ul id="instruction-list" class="list"></ul>
        </div>
        <form id="bot-form" class="stack">
          <input name="name" placeholder="Name" />
          <input name="model" placeholder="Model (blank uses the default)" />
          <textarea name="instructions" placeholder="Standing instructions" rows="4"></textarea>
          <label class="row"><input type="checkbox" name="fleet" /> Fleet tools (manage other bots)</label>
          <div class="row">
            <button type="submit">Save</button>
            <span id="bot-error" class="error"></span>
          </div>
        </form>
      </section>

      <div id="artifacts" class="artifacts"></div>
      <div id="attachments" class="artifacts"></div>
      <section id="thread" class="thread"></section>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="Give the bot a direction…"></textarea>
        <label class="icon-btn" title="Attach a file">📎<input type="file" id="attach" hidden /></label>
        <button type="button" id="mic" title="Dictate">🎙</button>
        <button type="button" id="speak" title="Read reply aloud">🔊</button>
        <button type="submit" id="send">Send</button>
      </form>
    </main>

    <dialog id="new-group-dialog">
      <form method="dialog" id="new-group-form" class="stack">
        <h2>New group</h2>
        <input name="title" placeholder="Title" />
        <input name="members" placeholder="Member bot names, comma separated" />
        <div class="row end">
          <button value="cancel" class="ghost">Cancel</button>
          <button value="create" id="create-group">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="new-space-dialog">
      <form method="dialog" id="new-space-form" class="stack">
        <h2>New space</h2>
        <input name="name" placeholder="Name" required />
        <div class="row end">
          <button value="cancel" class="ghost">Cancel</button>
          <button value="create" id="create-space">Create</button>
        </div>
      </form>
    </dialog>

    <dialog id="new-bot-dialog">
      <form method="dialog" id="new-bot-form" class="stack">
        <h2>New bot</h2>
        <input name="name" placeholder="Name" required />
        <textarea name="instructions" placeholder="What is this bot for?" rows="4"></textarea>
        <div class="row end">
          <button value="cancel" class="ghost">Cancel</button>
          <button value="create" id="create-bot">Create</button>
        </div>
      </form>
    </dialog>

    <script>
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    </script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
